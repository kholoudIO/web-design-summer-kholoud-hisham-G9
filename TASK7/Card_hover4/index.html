<!DOCTYPE html>
<html lang="ar">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Cards Hover</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <section class="container padding-top-bottom">
        <div class="cards-wrapper">

            <div class="card-hover">
                <div class="card-info">
                    <h3>Karan Singh</h3>
                    <p>Graphic Designer</p>
                </div>
                <img src="images/person1.jpg" alt="Karan Singh">
            </div>

            <div class="card-hover">
                <div class="card-info">
                    <h3>Sara Ahmed</h3>
                    <p>UI/UX Designer</p>
                </div>
                <img src="images/person2.jpg" alt="Sara Ahmed">
            </div>

            <div class="card-hover">
                <div class="card-info">
                    <h3>Aakash Agrawal</h3>
                    <p>Chartered Accountant C.A</p>
                </div>
                <img src="images/person3.jpg" alt="Aakash Agrawal">
            </div>

        </div>
    </section>

</body>

</html>
