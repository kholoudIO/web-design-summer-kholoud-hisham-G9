<!DOCTYPE html>
<html lang="ar">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Hover Effects</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="cards-wrapper">

        <div class="card-fold">
            <div class="fold-corner"><span>&#8594;</span></div>
            <h3>This is option 1</h3>
            <p>Card description with lots of great facts and interesting details.</p>
        </div>

        <div class="card-ribbon">
            <span class="ribbon-arrow">&#8594;</span>
            <div class="ribbon-icon">
                <svg viewBox="0 0 48 40" width="34" height="29">
                    <path d="M20 18 L30 8 L40 18 L38 18 L38 30 L22 30 L22 18 Z" fill="none" stroke="#4a4a4a" stroke-width="1.5" stroke-linejoin="round"></path>
                    <circle cx="27" cy="21.5" r="0.9" fill="#b6186e"></circle>
                    <circle cx="33" cy="21.5" r="0.9" fill="#b6186e"></circle>
                    <circle cx="27" cy="25" r="0.9" fill="#b6186e"></circle>
                    <circle cx="33" cy="25" r="0.9" fill="#b6186e"></circle>
                    <path d="M6 24 L15 16 L24 24 L22 24 L22 34 L8 34 L8 24 Z" fill="#ffffff" stroke="#4a4a4a" stroke-width="1.5" stroke-linejoin="round"></path>
                    <rect x="14" y="29" width="2" height="5" fill="#b6186e"></rect>
                </svg>
            </div>
            <h3>This is option 4</h3>
            <p>Card description with lots of great facts and interesting details.</p>
        </div>

    </div>

</body>

</html>
