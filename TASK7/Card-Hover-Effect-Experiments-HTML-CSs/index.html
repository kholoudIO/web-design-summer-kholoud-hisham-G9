<!DOCTYPE html>
<html lang="ar">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Hover Effects</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="cards-wrapper">

        <div class="card-fold">
            <div class="fold-corner"><span>&#8594;</span></div>
            <h3>This is option 1</h3>
            <p>Card description with lots of great facts and interesting details.</p>
        </div>

        <div class="card-ribbon">
            <span class="ribbon-arrow">&#8594;</span>
            <div class="ribbon-icon">&#127968;</div>
           
            <h3>This is option 4</h3>
            <p>Card description with lots of great facts and interesting details.</p>
        </div>

    </div>

</body>

</html>
