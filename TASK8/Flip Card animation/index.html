<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flip Card</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="card">
        <div class="card-inner">

            <div class="front">

                <div class="title">
                    Financial Sector Development Program
                </div>

                <div class="button">
                    <svg viewBox="0 0 24 24" fill="none" stroke="#19ABFE" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="7" y1="17" x2="17" y2="7"></line>
                        <polyline points="7 7 17 7 17 17"></polyline>
                    </svg>
                </div>

            </div>

            <div class="back">

                <svg class="icon" viewBox="0 0 105 95" fill="none">
                    <path d="M5 20 L35 5 L70 20 L100 5 L100 75 L70 90 L35 75 L5 90 Z"
                        stroke="#4CAF50"
                        stroke-width="4"
                        stroke-linejoin="round"
                        fill="none"/>
                    <line x1="35" y1="5" x2="35" y2="75" stroke="#4CAF50" stroke-width="4"/>
                    <line x1="70" y1="20" x2="70" y2="90" stroke="#4CAF50" stroke-width="4"/>
                </svg>

                <h3 class="title">
                    Financial Sector Development Program
                </h3>

                <p class="description">
                    The program aims to develop an effective financial sector that supports the growth of Saudi Arabia's economy.
                </p>

                <div class="read-more">
                    <span>Read More</span>

                    <div class="circle">
                        <svg viewBox="0 0 18 13" fill="none" stroke="#19ABFE" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="0" y1="6.3" x2="16" y2="6.3"></line>
                            <polyline points="10.5 0.5 16 6.3 10.5 12"></polyline>
                        </svg>
                    </div>

                </div>

            </div>

        </div>
    </div>

</body>
</html>
